<template>
    <!-- Account Credit Score and Payment Component -->
    <lightning-card title="Account Credit Score & Payment" icon-name="standard:account">
        <div class="slds-m-around_medium">

            <!-- Credit Score Section -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-text-heading_small slds-m-bottom_x-small">
                        Credit Score
                    </div>
                    <div class="slds-text-heading_large">
                        {creditScore}
                    </div>
                    <lightning-button
                        label="Refresh Score"
                        onclick={handleRefreshScore}
                        variant="brand"
                        class="slds-m-top_small"
                        disabled={isLoading}>
                    </lightning-button>
                </div>

                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-text-heading_small slds-m-bottom_x-small">
                        Risk Tier
                    </div>
                    <span class={riskTierClass}>
                        {riskTier}
                    </span>
                </div>
            </div>

            <!-- Premium Amount Section -->
            <div class="slds-m-bottom_medium">
                <div class="slds-text-heading_small slds-m-bottom_x-small">
                    Premium Amount
                </div>
                <div class="slds-text-heading_medium slds-text-color_success">
                    {formattedPremium}
                </div>
                <div class="slds-text-body_small slds-text-color_weak">
                    Based on your credit score and account details
                </div>
            </div>

            <!-- Payment Button -->
            <lightning-button
                label="Buy Premium"
                variant="success"
                onclick={handleBuyClick}
                disabled={isBuyDisabled}
                class="slds-m-top_medium">
            </lightning-button>

        </div>

        <div class="slds-m-around_medium slds-text-color_error">
            {errorMessage}
        </div>

    </lightning-card>
</template>
